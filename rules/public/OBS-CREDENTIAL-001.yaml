id: OBS-CREDENTIAL-001
version: 1.0.0
category: Credential Boundary
severity: high
dimension: security
penalty: 14
title: Tool arguments request credential material from the model
description: One or more advertised input schemas contain fields inferred to carry a token, password, API key, private key, or credential value.
why_it_matters: A credential placed in model-visible arguments can be copied from context, logged, replayed, or sent to the wrong tool. Discovery cannot prove that a real secret has been supplied.
recommendation: Remove raw credential values from tool arguments. Use identity-bound, short-lived credentials outside model context and apply AgntID policy to deny model-supplied secrets and scope each action.
references:
  - https://cheatsheetseries.owasp.org/cheatsheets/MCP_Security_Cheat_Sheet.html
  - https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices
tags: [owasp, credentials, least-privilege, confused-deputy, policy]
module: public
classification: credential-boundary
replay:
  title: A model-visible token is carried into a tool request
  trigger: A prompt, retrieved document, or previous result causes the model to populate a token, password, key, or credential parameter.
  unprotected_path: The credential becomes part of generated arguments and may be exposed to the wrong capability, logs, retries, or a manipulated destination.
  agntid_decision: AgntID rejects model-supplied credential material and requires an identity-bound, policy-approved credential path scoped to the intended tool and resource.
  protected_outcome: The model never chooses or transports the raw secret; the action receives only the bounded authority allowed for that identity and purpose.
query: data.observatory.credential.model_visible
evidence: [tool-intelligence]
enabled: true
