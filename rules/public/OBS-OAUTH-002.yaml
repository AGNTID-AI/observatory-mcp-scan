id: OBS-OAUTH-002
version: 1.0.0
category: OAuth Security
severity: high
dimension: security
penalty: 13
title: Authorization-server metadata failed secure validation
description: The protected resource identified an authorization server, but its OAuth or OpenID metadata could not be securely validated.
why_it_matters: Invalid issuer binding, unsafe endpoint URLs, missing PKCE metadata, or malformed discovery can redirect clients or prevent standards-compliant authorization.
recommendation: Correct the authorization-server discovery document, issuer binding, HTTPS endpoints, and PKCE advertisement before exposing the MCP server to general clients.
references: ["https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization", "https://www.rfc-editor.org/rfc/rfc8414"]
tags: [oauth, oidc, issuer, discovery, pkce]
module: public
query: data.observatory.oauth.authorization_metadata_invalid
evidence: [oauth-posture]
enabled: true
classification: posture
